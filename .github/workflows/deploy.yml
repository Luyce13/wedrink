name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Parallel Vet, Test & Build
        run: |
          go vet ./... &
          PID_VET=$!

          go test ./... &
          PID_TEST=$!

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -buildvcs=false \
            -ldflags="-s -w -X main.commit=${{ github.sha }}" \
            -o bin/wedrink ./cmd/server &
          PID_BUILD=$!

          TEST_OK=1; BUILD_OK=1; VET_OK=1
          wait "$PID_VET" || VET_OK=0
          wait "$PID_TEST" || TEST_OK=0
          wait "$PID_BUILD" || BUILD_OK=0

          [ "$VET_OK" -eq 1 ] || echo "::error::go vet failed"
          [ "$TEST_OK" -eq 1 ] || echo "::error::go test failed"
          [ "$BUILD_OK" -eq 1 ] || echo "::error::go build failed"
          [ "$VET_OK" -eq 1 ] && [ "$TEST_OK" -eq 1 ] && [ "$BUILD_OK" -eq 1 ]

      - name: Fast Package Deployment Artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          tar -czf release.tar.gz bin/wedrink web/

      - name: Publish GitHub Release (History + Rollback Point)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v-${{ github.sha }}
          name: Release ${{ github.sha }}
          files: release.tar.gz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Atomic Deploy, Health Check & Reload via SSH
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            source ~/.bashrc 2>/dev/null || source ~/.profile 2>/dev/null || true
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            case ":$PATH:" in
              *":$PNPM_HOME/bin:"*) ;;
              *) export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH" ;;
            esac

            APP_DIR="$HOME/wedrink"
            RELEASE_DIR="$APP_DIR/releases/${{ github.sha }}"
            mkdir -p "$RELEASE_DIR"

            curl -sSL --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 30 "https://github.com/Luyce13/wedrink/releases/download/v-${{ github.sha }}/release.tar.gz" -o /tmp/release.tar.gz
            tar -xzf /tmp/release.tar.gz -C "$RELEASE_DIR"
            rm -f /tmp/release.tar.gz

            # Copy production .env if present in APP_DIR
            if [ -f "$APP_DIR/.env" ]; then
              cp "$APP_DIR/.env" "$RELEASE_DIR/.env"
            fi

            # Atomic symlink swap
            ln -sfn "$RELEASE_DIR" "$APP_DIR/current.new"
            mv -Tf "$APP_DIR/current.new" "$APP_DIR/current"

            cd "$APP_DIR/current"
            pm2 reload wedrink || pm2 restart wedrink || pm2 start ./bin/wedrink --name wedrink

            # Cleanly prune older releases (keep last 5)
            cd "$APP_DIR/releases"
            ls -1dt * 2>/dev/null | tail -n +6 | while read -r d; do rm -rf "$d"; done