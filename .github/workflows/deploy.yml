name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Parallel Vet, Test & Build
        run: |
          go vet ./... &
          PID_VET=$!

          go test ./... &
          PID_TEST=$!

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o bin/wedrink ./cmd/server &
          PID_BUILD=$!

          wait $PID_VET || { echo "go vet failed"; exit 1; }
          wait $PID_TEST || { echo "go test failed"; exit 1; }
          wait $PID_BUILD || { echo "go build failed"; exit 1; }

      - name: Fast Package Deployment Artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          tar -czf release.tar.gz bin/wedrink web/

      - name: Publish Latest GitHub Release Asset
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Release
          files: release.tar.gz
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: VPS Direct Download & Reload PM2 via SSH
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            source ~/.bashrc 2>/dev/null || source ~/.profile 2>/dev/null || true
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            case ":$PATH:" in
              *":$PNPM_HOME/bin:"*) ;;
              *) export PATH="$PNPM_HOME/bin:$PNPM_HOME:$PATH" ;;
            esac

            APP_DIR="$HOME/wedrink"
            mkdir -p "$APP_DIR"

            curl -sL https://github.com/Luyce13/wedrink/releases/download/latest/release.tar.gz -o /tmp/release.tar.gz
            tar -xzf /tmp/release.tar.gz -C "$APP_DIR"
            rm -f /tmp/release.tar.gz

            cd "$APP_DIR"
            pm2 reload wedrink || pm2 restart wedrink || pm2 start ./bin/wedrink --name wedrink
