name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run Vet & Code Checks
        run: go vet ./...

      - name: Run Tests
        run: go test ./...

      - name: Build Production Linux Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -buildvcs=false -ldflags="-s -w" -o bin/wedrink ./cmd/server

      - name: Package Deployment Artifact
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          tar -czf release.tar.gz bin/wedrink web/

      - name: Setup Native SSH Agent
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy to VPS over Native SSH
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.VPS_PORT || 22 }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts
          scp -P ${{ secrets.VPS_PORT || 22 }} release.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/
          ssh -p ${{ secrets.VPS_PORT || 22 }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'EOF'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            NODE_BINS=$(find $HOME/.nvm/versions/node -type d -name bin 2>/dev/null | tr '\n' ':')
            export PATH="$NODE_BINS:$PATH:$HOME/.local/share/pnpm:$HOME/.pnpm-global/bin:$HOME/.npm-global/bin:/usr/local/bin:/usr/bin"
            
            APP_DIR="$HOME/wedrink"
            mkdir -p "$APP_DIR"
            tar -xzf /tmp/release.tar.gz -C "$APP_DIR"
            rm -f /tmp/release.tar.gz
            cd "$APP_DIR"
            pm2 reload wedrink || pm2 restart wedrink || pm2 start ./bin/wedrink --name wedrink
          EOF
