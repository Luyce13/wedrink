<div id="notif-dropdown-content" class="p-3 space-y-2 max-h-80 overflow-y-auto">
  {{if .Notifications}}
    <div class="px-1 py-1 flex items-center justify-between border-b border-slate-800 pb-2 mb-2">
      <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">Store Remarks</span>
      <span class="badge badge-info text-[10px]">{{.UnreadCount}} Unread</span>
    </div>
    {{range .Notifications}}
    <div id="notif-item-{{.ID.Hex}}" class="p-2.5 bg-slate-900/90 border border-slate-800 rounded-xl hover:border-slate-700 transition flex items-start gap-2.5 group">
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between gap-1">
          <a href="/?date={{.ReportDate}}" class="text-xs font-bold text-sky-400 hover:underline truncate">{{.ReportDate}}</a>
          <span class="text-[10px] text-slate-500 font-mono whitespace-nowrap">{{.SubmittedBy}}</span>
        </div>
        <p class="text-xs text-slate-200 mt-1 leading-relaxed break-words bg-slate-950/60 p-2 rounded-lg border border-slate-800/60">{{.Notes}}</p>
      </div>
      <!-- Tick button to mark as read -->
      <button type="button"
              hx-post="/notifications/mark-read?id={{.ID.Hex}}"
              hx-target="#notif-dropdown-container"
              hx-swap="innerHTML"
              title="Mark as read"
              class="w-7 h-7 rounded-lg bg-emerald-950/60 hover:bg-emerald-600 text-emerald-400 hover:text-white border border-emerald-500/30 flex items-center justify-center transition flex-shrink-0 mt-0.5 shadow-sm text-xs font-bold">
        ✓
      </button>
    </div>
    {{end}}
  {{else}}
    <div class="p-6 text-center text-slate-500 text-xs">
      <div class="text-xl mb-1 opacity-50">✨</div>
      No unread store remarks
    </div>
  {{end}}
</div>
