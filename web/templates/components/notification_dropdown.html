<div id="notif-dropdown-content" class="flex flex-col max-h-[26rem]">
  <!-- Filter Tabs Header -->
  <div class="px-3 py-2 flex items-center justify-between border-b border-slate-800 bg-slate-950/90 sticky top-0 z-10 backdrop-blur-md">
    <div class="flex items-center gap-1 bg-slate-900 p-0.5 rounded-lg border border-slate-800">
      <button type="button"
              hx-get="/notifications/list?filter=unread"
              hx-target="#notif-dropdown-container"
              hx-swap="innerHTML"
              class="px-2.5 py-1 rounded-md text-[11px] font-bold transition {{if eq .Filter `unread` }}bg-brand-600 text-white shadow-sm{{else}}text-slate-400 hover:text-slate-200{{end}}">
        Unread {{if gt .UnreadCount 0}}<span class="ml-1 px-1.5 py-0.2 bg-rose-950 text-rose-300 rounded-full text-[10px]">{{.UnreadCount}}</span>{{end}}
      </button>
      <button type="button"
              hx-get="/notifications/list?filter=all"
              hx-target="#notif-dropdown-container"
              hx-swap="innerHTML"
              class="px-2.5 py-1 rounded-md text-[11px] font-bold transition {{if eq .Filter `all` }}bg-brand-600 text-white shadow-sm{{else}}text-slate-400 hover:text-slate-200{{end}}">
        All Remarks
      </button>
    </div>
    <span class="text-[10px] text-slate-500 uppercase tracking-wider font-mono">Store Notes</span>
  </div>

  <!-- Scrollable Items Container -->
  <div id="notif-items-container" class="p-3 space-y-2 overflow-y-auto flex-1">
    {{template "notification_items.html" .}}
  </div>
</div>
