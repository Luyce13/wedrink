<div class="flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80 hover:border-slate-700 transition">
  <div class="flex-1">
    <input type="text" name="expenseDesc[]" placeholder="Expense description (e.g. Milk, Ice, Supplies)" class="glass-input text-xs">
  </div>
  <div class="w-36 relative">
    <span class="absolute left-2.5 top-2 text-xs text-slate-500 font-bold">Rs.</span>
    <input type="number" step="1" name="expenseAmount[]" placeholder="0" class="glass-input pl-8 text-xs font-bold">
  </div>
  <button type="button" onclick="this.closest('.flex').remove()" class="p-2 text-slate-500 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition" title="Remove row">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
    </svg>
  </button>
</div>
