<div class="expense-row">
  <span class="row-badge" title="Click to focus · Shift-click to delete">1</span>
  <div class="desc-input">
    <input type="text" name="expenseDesc[]" placeholder="Description" class="glass-input text-xs" autocomplete="off">
  </div>
  <div class="amt-input">
    <input type="text" inputmode="numeric" name="expenseAmount[]" placeholder="0" class="glass-input number-input text-xs">
  </div>
  <button type="button" class="del-btn" title="Remove">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
    </svg>
  </button>
</div>
