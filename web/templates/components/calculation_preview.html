<!-- Calculation preview: server-side fragment (used as fallback / edit mode init) -->
<script>
  // This fragment fires after HTMX swaps in a server-calculated preview.
  // Push values into the sticky calc strip if it exists.
  (function() {
    const strip = document.getElementById('calc-strip');
    if (!strip) return;
    const data = {
      expenses: '{{if .TotalExpenses}}{{printf "%.0f" .TotalExpenses}}{{else}}0{{end}}',
      expected: '{{if .ExpectedCash}}{{printf "%.0f" .ExpectedCash}}{{else}}0{{end}}',
      diff:     '{{if .Difference}}{{printf "%.0f" .Difference}}{{else}}0{{end}}',
    };
    const fmt = n => parseInt(n, 10).toLocaleString('en-IN');
    const d   = parseInt(data.diff, 10);
    const el = {
      exp:  document.getElementById('strip-expenses'),
      exc:  document.getElementById('strip-expected'),
      dif:  document.getElementById('strip-diff'),
      difw: document.getElementById('strip-diff-wrap'),
    };
    if (el.exp)  el.exp.textContent  = fmt(data.expenses);
    if (el.exc)  el.exc.textContent  = fmt(data.expected);
    if (el.dif && el.difw) {
      if (d === 0) {
        el.dif.textContent = '0  (Balanced)';
        el.difw.className  = 'ci-value text-emerald-400';
      } else if (d < 0) {
        el.dif.textContent = `${fmt(d)}  (Short)`;
        el.difw.className  = 'ci-value text-rose-400';
      } else {
        el.dif.textContent = `+${fmt(d)}  (Surplus)`;
        el.difw.className  = 'ci-value text-cyan-400';
      }
    }
  })();
</script>
