{{define "content"}}
<div class="space-y-4">

  {{if .Success}}
  <div class="alert-banner p-4 text-xs font-semibold text-emerald-300 bg-emerald-950/80 border border-emerald-800 rounded-lg flex items-center justify-between shadow-lg">
    <span>✓ {{.Success}}</span>
    <button type="button" onclick="dismissAlert(this.parentElement)" class="text-emerald-400 hover:text-white text-sm px-2">✕</button>
  </div>
  {{end}}

  {{if .Error}}
  <div class="alert-banner p-4 text-xs font-semibold text-rose-300 bg-rose-950/80 border border-rose-800 rounded-lg flex items-center justify-between shadow-lg">
    <span>⚠ {{.Error}}</span>
    <button type="button" onclick="dismissAlert(this.parentElement)" class="text-rose-400 hover:text-white text-sm px-2">✕</button>
  </div>
  {{end}}

  <!-- Filters + Sorting + Export -->
  <div class="bg-[#131f3a] border border-[#1e2d4a] px-4 py-3 rounded-lg">
    <form id="reports-filter-form" hx-get="/reports" hx-target="#report-table-container" hx-swap="innerHTML"
          hx-trigger="submit"
          hx-vals='{"partial": "true"}'
          autocomplete="off"
          class="flex flex-wrap items-end gap-3">
      <!-- FROM Custom Datepicker -->
      <div class="relative">
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">From</label>
        <input type="hidden" id="startDate" name="startDate" value="{{.StartDate}}">
        <button type="button" id="dp-from-trigger" class="date-trigger text-xs py-1.5 px-3 min-w-[8.5rem] w-36 justify-between bg-[#080e1e] border-[#1e2d4a]">
          <span id="dp-from-label" class="text-xs truncate">{{if .StartDate}}{{.StartDate}}{{else}}Select date{{end}}</span>
          <svg class="dt-icon w-3.5 h-3.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2"/><line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/></svg>
        </button>
        <div id="dp-from-panel" class="date-panel hidden">
          <div class="cal-grid-view">
            <div class="cal-header">
              <button type="button" id="dp-from-prev" class="cal-nav" aria-label="Previous month"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" stroke-width="2.5"/></svg></button>
              <div class="cal-month-label"><span id="dp-from-month-text"></span></div>
              <button type="button" id="dp-from-next" class="cal-nav" aria-label="Next month"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" stroke-width="2.5"/></svg></button>
            </div>
            <div class="cal-weekdays">
              <div class="cal-weekday weekend">Su</div><div class="cal-weekday">Mo</div><div class="cal-weekday">Tu</div><div class="cal-weekday">We</div><div class="cal-weekday">Th</div><div class="cal-weekday">Fr</div><div class="cal-weekday weekend">Sa</div>
            </div>
            <div id="dp-from-grid" class="cal-grid"></div>
            <div class="cal-footer">
              <button type="button" id="dp-from-clear" class="cal-footer-btn">Clear</button>
              <button type="button" id="dp-from-today" class="cal-footer-btn">Today</button>
            </div>
          </div>
        </div>
      </div>

      <!-- TO Custom Datepicker -->
      <div class="relative">
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">To</label>
        <input type="hidden" id="endDate" name="endDate" value="{{.EndDate}}">
        <button type="button" id="dp-to-trigger" class="date-trigger text-xs py-1.5 px-3 min-w-[8.5rem] w-36 justify-between bg-[#080e1e] border-[#1e2d4a]">
          <span id="dp-to-label" class="text-xs truncate">{{if .EndDate}}{{.EndDate}}{{else}}Select date{{end}}</span>
          <svg class="dt-icon w-3.5 h-3.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" stroke-width="2"/><line x1="16" y1="2" x2="16" y2="6" stroke-width="2"/><line x1="8" y1="2" x2="8" y2="6" stroke-width="2"/><line x1="3" y1="10" x2="21" y2="10" stroke-width="2"/></svg>
        </button>
        <div id="dp-to-panel" class="date-panel hidden">
          <div class="cal-grid-view">
            <div class="cal-header">
              <button type="button" id="dp-to-prev" class="cal-nav" aria-label="Previous month"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" stroke-width="2.5"/></svg></button>
              <div class="cal-month-label"><span id="dp-to-month-text"></span></div>
              <button type="button" id="dp-to-next" class="cal-nav" aria-label="Next month"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" stroke-width="2.5"/></svg></button>
            </div>
            <div class="cal-weekdays">
              <div class="cal-weekday weekend">Su</div><div class="cal-weekday">Mo</div><div class="cal-weekday">Tu</div><div class="cal-weekday">We</div><div class="cal-weekday">Th</div><div class="cal-weekday">Fr</div><div class="cal-weekday weekend">Sa</div>
            </div>
            <div id="dp-to-grid" class="cal-grid"></div>
            <div class="cal-footer">
              <button type="button" id="dp-to-clear" class="cal-footer-btn">Clear</button>
              <button type="button" id="dp-to-today" class="cal-footer-btn">Today</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Sorting options -->
      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Sort By</label>
        <select name="sortBy" onchange="updateReportsFilterState()" class="glass-input text-xs py-1.5 px-2 bg-[#080e1e] text-slate-200 border-[#1e2d4a] rounded w-36 cursor-pointer" autocomplete="off">
          <option value="date" {{if eq .SortBy "date"}}selected{{end}}>Date</option>
          <option value="total_sale" {{if eq .SortBy "total_sale"}}selected{{end}}>Total Sales</option>
          <option value="credit_sale" {{if eq .SortBy "credit_sale"}}selected{{end}}>Card Sales</option>
          <option value="bank_transfer" {{if eq .SortBy "bank_transfer"}}selected{{end}}>Bank Transfers</option>
          <option value="other_payments" {{if eq .SortBy "other_payments"}}selected{{end}}>Expenses</option>
          <option value="difference" {{if eq .SortBy "difference"}}selected{{end}}>Discrepancy</option>
        </select>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Order</label>
        <select name="sortOrder" onchange="updateReportsFilterState()" class="glass-input text-xs py-1.5 px-2 bg-[#080e1e] text-slate-200 border-[#1e2d4a] rounded w-44 cursor-pointer" autocomplete="off">
          <option value="desc" {{if eq .SortOrder "desc"}}selected{{end}}>Descending</option>
          <option value="asc" {{if eq .SortOrder "asc"}}selected{{end}}>Ascending</option>
        </select>
      </div>

      <div class="flex gap-2">
        <button id="reports-apply-btn" type="submit" disabled class="btn btn-primary text-xs py-1.5 px-3 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none transition">Apply</button>
        <a id="reports-reset-btn" href="/reports" class="btn btn-[#080e1e] text-xs py-1.5 px-3 text-slate-400 border-[#1e2d4a] hover:text-white disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none transition">Reset</a>
      </div>

      {{if .User.CanExportData}}
      <div class="ml-auto">
        <button type="button" onclick="triggerUnifiedExport()" class="btn bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/40 text-xs py-1.5 px-3 flex items-center gap-1.5 font-medium shadow-sm transition" title="Export to Excel (.xlsx 2-Tab)">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Export
        </button>
      </div>
      {{end}}
    </form>
  </div>

  <!-- Table Container -->
  <div id="report-table-container" class="bg-[#131f3a] border border-[#1e2d4a] rounded-lg overflow-hidden">
    {{template "report_table.html" .}}
  </div>

</div>

<script>
window.updateReportsFilterState = function() {
  const form = document.getElementById('reports-filter-form');
  if (!form) return;

  const startDate = document.getElementById('startDate')?.value || '';
  const endDate   = document.getElementById('endDate')?.value || '';
  const sortBy    = form.querySelector('[name="sortBy"]')?.value || 'date';
  const sortOrder = form.querySelector('[name="sortOrder"]')?.value || 'desc';

  const isModified = (startDate !== '') || (endDate !== '') || (sortBy !== 'date' && sortBy !== '') || (sortOrder !== 'desc');

  const applyBtn = document.getElementById('reports-apply-btn');
  const resetBtn = document.getElementById('reports-reset-btn');

  if (applyBtn) applyBtn.disabled = !isModified;
  if (resetBtn) {
    if (isModified) {
      resetBtn.removeAttribute('disabled');
      resetBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
    } else {
      resetBtn.setAttribute('disabled', 'true');
      resetBtn.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
    }
  }
};

window.initReportsCustomDatePickers = function() {
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

  function setupPicker(prefix, hiddenId, isFrom) {
    const trigger = document.getElementById(`dp-${prefix}-trigger`);
    const panel   = document.getElementById(`dp-${prefix}-panel`);
    const hidden  = document.getElementById(hiddenId);
    const grid    = document.getElementById(`dp-${prefix}-grid`);
    const monthText = document.getElementById(`dp-${prefix}-month-text`);
    const label   = document.getElementById(`dp-${prefix}-label`);

    if (!trigger || !panel || !hidden || !grid) return null;
    if (trigger._inited) return trigger._renderFn || null;

    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth();

    if (hidden.value) {
      const parts = hidden.value.split('-');
      if (parts.length === 3) {
        viewYear = +parts[0];
        viewMonth = +parts[1] - 1;
      }
    }

    function render() {
      if (viewYear < 2026 || (viewYear === 2026 && viewMonth < 6)) {
        viewYear = 2026;
        viewMonth = 6;
      }
      if (monthText) monthText.textContent = `${MONTHS[viewMonth]} ${viewYear}`;

      const todayIso = new Date().toISOString().split('T')[0];
      const minDate  = '2026-07-01';

      const startDateVal = document.getElementById('startDate')?.value || '';
      const endDateVal   = document.getElementById('endDate')?.value || '';

      const first  = new Date(viewYear, viewMonth, 1);
      const offset = first.getDay();
      const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
      const daysInPrev  = new Date(viewYear, viewMonth, 0).getDate();

      const cells = [];
      for (let i = offset - 1; i >= 0; i--) {
        cells.push({ d: daysInPrev - i, outside: true });
      }
      for (let d = 1; d <= daysInMonth; d++) {
        cells.push({ d, outside: false });
      }
      while (cells.length % 7 !== 0) {
        cells.push({ d: cells.length, outside: true });
      }

      grid.innerHTML = cells.map(c => {
        if (c.outside) return `<button type="button" class="cal-day outside disabled" disabled>${c.d}</button>`;
        const iso = `${viewYear}-${String(viewMonth + 1).padStart(2, '0')}-${String(c.d).padStart(2, '0')}`;

        let isDisabled = false;
        let title = '';

        if (iso < minDate) {
          isDisabled = true;
          title = 'Prior to July 2026';
        } else if (iso > todayIso) {
          isDisabled = true;
          title = 'Future Date';
        } else if (isFrom && endDateVal && iso > endDateVal) {
          isDisabled = true;
          title = 'Cannot be after To date';
        } else if (!isFrom && startDateVal && iso < startDateVal) {
          isDisabled = true;
          title = 'Cannot be before From date';
        }

        let cls = 'cal-day';
        if (isDisabled) cls += ' outside disabled future-disabled';
        if (hidden.value === iso) cls += ' selected';
        if (todayIso === iso) cls += ' today';

        const disAttr = isDisabled ? 'disabled="disabled"' : '';
        const titleAttr = title ? `title="${title}"` : '';

        return `<button type="button" class="${cls}" data-iso="${iso}" ${disAttr} ${titleAttr}>${c.d}</button>`;
      }).join('');

      grid.querySelectorAll('.cal-day:not([disabled])').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const iso = btn.dataset.iso;
          hidden.value = iso;
          if (label) label.textContent = iso;
          panel.classList.add('hidden');
          if (window.updateReportsFilterState) window.updateReportsFilterState();
          if (window.refreshFilterPickers) window.refreshFilterPickers();
        });
      });
    }

    trigger.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.date-panel').forEach(p => { if (p !== panel) p.classList.add('hidden'); });
      const willOpen = panel.classList.contains('hidden');
      panel.classList.toggle('hidden', !willOpen);
      if (willOpen) {
        if (window.autoAlignPanel) window.autoAlignPanel(panel, trigger);
        render();
      }
    });

    document.getElementById(`dp-${prefix}-prev`)?.addEventListener('click', (e) => { e.stopPropagation(); viewMonth--; if (viewMonth < 0) { viewMonth = 11; viewYear--; } render(); });
    document.getElementById(`dp-${prefix}-next`)?.addEventListener('click', (e) => { e.stopPropagation(); viewMonth++; if (viewMonth > 11) { viewMonth = 0; viewYear++; } render(); });
    document.getElementById(`dp-${prefix}-clear`)?.addEventListener('click', (e) => { e.stopPropagation(); hidden.value = ''; if (label) label.textContent = 'Select date'; panel.classList.add('hidden'); if (window.updateReportsFilterState) window.updateReportsFilterState(); if (window.refreshFilterPickers) window.refreshFilterPickers(); });
    document.getElementById(`dp-${prefix}-today`)?.addEventListener('click', (e) => { e.stopPropagation(); hidden.value = new Date().toISOString().split('T')[0]; if (label) label.textContent = hidden.value; panel.classList.add('hidden'); if (window.updateReportsFilterState) window.updateReportsFilterState(); if (window.refreshFilterPickers) window.refreshFilterPickers(); });

    trigger._inited = true;
    trigger._renderFn = render;
    return render;
  }

  const renderFrom = setupPicker('from', 'startDate', true);
  const renderTo   = setupPicker('to', 'endDate', false);

  window.refreshFilterPickers = function() {
    if (renderFrom) renderFrom();
    if (renderTo) renderTo();
  };

  if (!window._filterPickersDocClick) {
    window._filterPickersDocClick = true;
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#dp-from-panel') && !e.target.closest('#dp-from-trigger') &&
          !e.target.closest('#dp-to-panel') && !e.target.closest('#dp-to-trigger')) {
        document.getElementById('dp-from-panel')?.classList.add('hidden');
        document.getElementById('dp-to-panel')?.classList.add('hidden');
      }
    });
  }
};

window.initReportsCustomDatePickers();
window.updateReportsFilterState();
document.addEventListener('DOMContentLoaded', () => {
  window.initReportsCustomDatePickers();
  window.updateReportsFilterState();
});
</script>
{{end}}
