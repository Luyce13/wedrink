{{define "content"}}
<div class="space-y-4">

  <!-- Filters + Sorting + Export -->
  <div class="bg-[#131f3a] border border-[#1e2d4a] px-4 py-3 rounded-lg">
    <form id="reports-filter-form" hx-get="/reports" hx-target="#report-table-container" hx-swap="innerHTML"
          hx-trigger="submit"
          hx-vals='{"partial": "true"}'
          autocomplete="off"
          class="flex flex-wrap items-end gap-3">
      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">From</label>
        <input type="date" name="startDate" value="{{.StartDate}}" oninput="updateReportsFilterState()" class="glass-input text-xs py-1.5 w-36" autocomplete="off">
      </div>
      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">To</label>
        <input type="date" name="endDate" value="{{.EndDate}}" oninput="updateReportsFilterState()" class="glass-input text-xs py-1.5 w-36" autocomplete="off">
      </div>

      <!-- Sorting options -->
      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Sort By</label>
        <select name="sortBy" onchange="updateReportsFilterState()" class="glass-input text-xs py-1.5 px-2 bg-[#080e1e] text-slate-200 border-[#1e2d4a] rounded w-36 cursor-pointer" autocomplete="off">
          <option value="date" {{if eq .SortBy "date"}}selected{{end}}>Date</option>
          <option value="total_sale" {{if eq .SortBy "total_sale"}}selected{{end}}>Total Sales</option>
          <option value="credit_sale" {{if eq .SortBy "credit_sale"}}selected{{end}}>Card Sales</option>
          <option value="bank_transfer" {{if eq .SortBy "bank_transfer"}}selected{{end}}>Bank Transfers</option>
          <option value="other_payments" {{if eq .SortBy "other_payments"}}selected{{end}}>Expenses</option>
          <option value="difference" {{if eq .SortBy "difference"}}selected{{end}}>Discrepancy</option>
        </select>
      </div>

      <div>
        <label class="block text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-1">Order</label>
        <select name="sortOrder" onchange="updateReportsFilterState()" class="glass-input text-xs py-1.5 px-2 bg-[#080e1e] text-slate-200 border-[#1e2d4a] rounded w-44 cursor-pointer" autocomplete="off">
          <option value="desc" {{if eq .SortOrder "desc"}}selected{{end}}>Descending</option>
          <option value="asc" {{if eq .SortOrder "asc"}}selected{{end}}>Ascending</option>
        </select>
      </div>

      <div class="flex gap-2">
        <button id="reports-apply-btn" type="submit" disabled class="btn btn-primary text-xs py-1.5 px-3 disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none transition">Apply</button>
        <a id="reports-reset-btn" href="/reports" class="btn btn-[#080e1e] text-xs py-1.5 px-3 text-slate-400 border-[#1e2d4a] hover:text-white disabled:opacity-40 disabled:cursor-not-allowed disabled:pointer-events-none transition">Reset</a>
      </div>

      {{if .User.CanExportData}}
      <div class="ml-auto">
        <button type="button" onclick="triggerUnifiedExport()" class="btn bg-emerald-950/80 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/40 text-xs py-1.5 px-3 flex items-center gap-1.5 font-medium shadow-sm transition" title="Export to Excel (.xlsx 2-Tab)">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          Export
        </button>
      </div>
      {{end}}
    </form>
  </div>

  <!-- Table Container -->
  <div id="report-table-container" class="bg-[#131f3a] border border-[#1e2d4a] rounded-lg overflow-hidden">
    {{template "report_table.html" .}}
  </div>

</div>

<script>
window.updateReportsFilterState = function() {
  const form = document.getElementById('reports-filter-form');
  if (!form) return;

  const startDate = form.querySelector('[name="startDate"]')?.value || '';
  const endDate   = form.querySelector('[name="endDate"]')?.value || '';
  const sortBy    = form.querySelector('[name="sortBy"]')?.value || 'date';
  const sortOrder = form.querySelector('[name="sortOrder"]')?.value || 'desc';

  const isModified = (startDate !== '') || (endDate !== '') || (sortBy !== 'date' && sortBy !== '') || (sortOrder !== 'desc');

  const applyBtn = document.getElementById('reports-apply-btn');
  const resetBtn = document.getElementById('reports-reset-btn');

  if (applyBtn) applyBtn.disabled = !isModified;
  if (resetBtn) {
    if (isModified) {
      resetBtn.removeAttribute('disabled');
      resetBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
    } else {
      resetBtn.setAttribute('disabled', 'true');
      resetBtn.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
    }
  }
};

if (window.updateReportsFilterState) window.updateReportsFilterState();
document.addEventListener('DOMContentLoaded', () => {
  if (window.updateReportsFilterState) window.updateReportsFilterState();
});
</script>
{{end}}
