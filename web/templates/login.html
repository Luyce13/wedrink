{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center">
  <div class="bg-[#131f3a] border border-[#1e2d4a] w-full max-w-md p-8 rounded-lg shadow-xl">

    <div class="text-center mb-6">
      <img src="/static/images/logo.webp" alt="Wedrink Logo" class="h-12 w-auto mx-auto mb-3 object-contain">
      <h1 class="text-xl font-bold text-white tracking-tight">Wedrink EOD Portal</h1>
      <p class="text-xs text-slate-400 mt-1">Sign in to access store daily closure & report management</p>
    </div>

    <!-- Error message slot -->
    <div id="login-error">
      {{if .Error}}
      <div class="alert-banner p-3 bg-rose-950/90 border border-rose-500/60 text-rose-200 text-xs font-semibold rounded mb-5 flex items-center gap-2">
        <svg class="w-4 h-4 text-rose-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span>{{.Error}}</span>
      </div>
      {{end}}
    </div>

    <!-- Login Form -->
    <form hx-post="/login" hx-target="#login-error" hx-swap="innerHTML" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
        <input type="text" name="username" id="input-username" required placeholder="Enter username" class="glass-input">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" name="password" id="input-password" required placeholder="Enter password" class="glass-input">
      </div>

      <button type="submit" class="btn btn-primary w-full py-2.5 text-xs font-bold mt-2">
        Sign In to Portal
      </button>
    </form>

  </div>
</div>
{{end}}
