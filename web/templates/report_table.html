<div class="overflow-x-auto max-h-[calc(100vh-14rem)] overflow-y-auto">
  <table class="w-full text-left border-collapse text-xs">
    <thead>
      <tr class="sticky-thead border-b border-slate-700 text-[11px] font-extrabold text-slate-300 uppercase tracking-wider bg-[#060d1b]">
        <th class="p-3 w-8 text-center">
          <input type="checkbox" onclick="selectAllReports(this)" class="w-3.5 h-3.5 rounded border-slate-700">
        </th>
        <th class="p-3">Date</th>
        <th class="p-3 text-right">Total Sales</th>
        <th class="p-3 text-right">Card</th>
        <th class="p-3 text-right">Bank</th>
        <th class="p-3 text-right">Expenses</th>
        <th class="p-3 text-right">Exp. Cash</th>
        <th class="p-3 text-right">Till Cash</th>
        <th class="p-3 text-center">Diff</th>
        <th class="p-3">By</th>
        <th class="p-3 text-center">Actions</th>
      </tr>
    </thead>
    <tbody id="report-table-body" class="divide-y divide-slate-800/60">
      {{if .Reports}}
        {{template "report_rows.html" .}}
      {{else}}
        <tr>
          <td colspan="11" class="p-8 text-center text-slate-500 italic text-xs">
            No reports found matching your criteria.
          </td>
        </tr>
      {{end}}
    </tbody>
  </table>
</div>

<!-- Scroll spinner for HTMX infinite pagination -->
<div id="scroll-spinner" class="htmx-indicator py-4 text-center text-xs font-semibold text-cyan-400 flex items-center justify-center gap-2">
  <svg class="w-4 h-4 animate-spin text-cyan-400" fill="none" viewBox="0 0 24 24">
    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
  </svg>
  Loading next 100 reports...
</div>
